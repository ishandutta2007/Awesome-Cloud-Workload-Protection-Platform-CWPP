<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="cyberBlue" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="coreGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes scan{0%{transform:translateY(-50px);opacity:0}15%,85%{opacity:1}}@keyframes rotate{0%{transform:rotate(0deg)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.grid-line{stroke:#1e293b;stroke-width:1;stroke-opacity:.45}.pulse-circle{animation:pulse 4s infinite ease-in-out}.scan-line{animation:scan 8s infinite linear}.float-slow{animation:float 6s infinite ease-in-out}.radar-beam{transform-origin:1050px 210px;animation:rotate 10s infinite linear}.data-stream{stroke-dasharray:8,12;animation:flow 20s infinite linear}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px}.badge-text,.sub-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-weight:500;font-size:18px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g class="grid-layer"><line x1="0" x2="1200" y1="70" y2="70" class="grid-line"/><line x1="0" x2="1200" y1="140" y2="140" class="grid-line"/><line x1="0" x2="1200" y1="210" y2="210" class="grid-line"/><line x1="0" x2="1200" y1="280" y2="280" class="grid-line"/><line x1="0" x2="1200" y1="350" y2="350" class="grid-line"/><line x1="150" x2="150" y1="0" y2="420" class="grid-line"/><line x1="300" x2="300" y1="0" y2="420" class="grid-line"/><line x1="450" x2="450" y1="0" y2="420" class="grid-line"/><line x1="600" x2="600" y1="0" y2="420" class="grid-line"/><line x1="750" x2="750" y1="0" y2="420" class="grid-line"/><line x1="900" x2="900" y1="0" y2="420" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="420" class="grid-line"/></g><circle cx="1050" cy="210" r="160" fill="#38bdf8" fill-opacity=".08" class="pulse-circle" filter="url(#coreGlow)" style="transform-origin:1050px 210px"/><circle cx="200" cy="100" r="130" fill="#818cf8" fill-opacity=".06" class="pulse-circle" filter="url(#coreGlow)" style="transform-origin:200px 100px;animation-delay:-2s"/><path fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2" d="M 0 350 Q 400 320 700 360 T 1200 330" class="data-stream"/><path fill="none" stroke="#818cf8" stroke-opacity=".25" stroke-width="1.5" d="M 0 280 Q 500 240 850 300 T 1200 260" class="data-stream" style="animation-direction:reverse"/><g opacity=".65"><circle cx="1050" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-dasharray="4 6" stroke-opacity=".3" stroke-width="1.5"/><circle cx="1050" cy="210" r="75" fill="none" stroke="#818cf8" stroke-opacity=".4" stroke-width="1"/><circle cx="1050" cy="210" r="40" fill="none" stroke="#c084fc"