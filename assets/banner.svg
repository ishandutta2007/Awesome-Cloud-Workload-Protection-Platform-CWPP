<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.45; }
    .pulse-circle { animation: pulse 4s infinite ease-in-out; }
    .scan-line { animation: scan 8s infinite linear; }
    .float-slow { animation: float 6s infinite ease-in-out; }
    .radar-beam { transform-origin: 1050px 210px; animation: rotate 10s infinite linear; }
    .data-stream { stroke-dasharray: 8, 12; animation: flow 20s infinite linear; }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Tech Grid -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="1050" cy="210" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#coreGlow)" class="pulse-circle" style="transform-origin: 1050px 210px;" />
  <circle cx="200" cy="100" r="130" fill="#818cf8" fill-opacity="0.06" filter="url(#coreGlow)" class="pulse-circle" style="transform-origin: 200px 100px; animation-delay: -2s;" />

  <!-- Animated Data Highway Lines -->
  <path d="M 0 350 Q 400 320 700 360 T 1200 330" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="data-stream" />
  <path d="M 0 280 Q 500 240 850 300 T 1200 260" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" class="data-stream" style="animation-direction: reverse;" />

  <!-- Dynamic Radar Scanner (Right Side Visual Decoration) -->
  <g opacity="0.65">
    <circle cx="1050" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 6" />
    <circle cx="1050" cy="210" r="75" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1050" cy="210" r="40" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Rotating Sweep Beam -->
    <g class="radar-beam">
      <path d="M 1050 210 L 1150 160 A 110 110 0 0 0 1050 100 Z" fill="url(#shieldGrad)" />
      <line x1="1050" y1="210" x2="1150" y2="160" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
    </g>
    
    <!-- Radar Node Blips -->
    <circle cx="1080" cy="165" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1010" cy="245" r="3" fill="#a855f7" />
    <circle cx="1090" cy="250" r="3.5" fill="#34d399" />
  </g>

  <!-- Animated Scanline effect passing through -->
  <g class="scan-line">
    <line x1="20" y1="0" x2="1180" y2="0" stroke="url(#cyberBlue)" stroke-width="2" stroke-opacity="0.5" filter="url(#glow)" />
  </g>

  <!-- Foreground Protective Shield Icon & Branding (Never Overlapped) -->
  <g transform="translate(80, 75)">
    <!-- Shield Graphic -->
    <g class="float-slow" transform="translate(0, 15)">
      <polygon points="45,5 85,20 85,60 45,95 5,60 5,20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
      <path d="M45,22 L68,33 L68,58 L45,80 L22,58 L22,33 Z" fill="none" stroke="url(#cyberBlue)" stroke-width="2" opacity="0.8" />
      <circle cx="45" cy="50" r="8" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Header Text Block -->
    <g transform="translate(115, 30)">
      <text x="0" y="38" fill="url(#cyberBlue)" class="title-text" filter="url(#glow)">Awesome CWPP</text>
      <text x="0" y="74" fill="#f8fafc" class="title-text" font-size="30" font-weight="700">Cloud Workload Protection Platforms</text>
      <text x="0" y="112" class="sub-text">Curated guide to Runtime Threat Defense, Container &amp; eBPF Security, K8s, and CNAPP</text>

      <!-- Interactive Dynamic Feature Pills -->
      <g transform="translate(0, 142)">
        <!-- Pill 1: Runtime Defense -->
        <g transform="translate(0, 0)">
          <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
          <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow)" />
          <text x="32" y="22" class="badge-text">Runtime Defense</text>
        </g>
        <!-- Pill 2: eBPF Telemetry -->
        <g transform="translate(182, 0)">
          <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
          <circle cx="18" cy="17" r="5" fill="#818cf8" filter="url(#glow)" />
          <text x="32" y="22" class="badge-text">eBPF Telemetry</text>
        </g>
        <!-- Pill 3: K8s & Containers -->
        <g transform="translate(354, 0)">
          <rect width="175" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
          <circle cx="18" cy="17" r="5" fill="#c084fc" filter="url(#glow)" />
          <text x="32" y="22" class="badge-text">K8s &amp; Containers</text>
        </g>
        <!-- Pill 4: Open Source & SaaS -->
        <g transform="translate(541, 0)">
          <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
          <circle cx="18" cy="17" r="5" fill="#34d399" filter="url(#glow)" />
          <text x="32" y="22" class="badge-text">Open Source &amp; SaaS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
